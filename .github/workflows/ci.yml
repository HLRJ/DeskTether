name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Node 24
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.10.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Tunnel integration tests
        run: pnpm test:tunnel
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: ChatGPT readiness
        run: pnpm chatgpt:doctor

  linux-core:
    name: Linux core / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.10.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Core tests
        run: pnpm --filter @desktether/core test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
